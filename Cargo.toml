[package]
name = "htopmodern"
version = "0.1.0"
edition = "2021"
description = "A cozy terminal dashboard for macOS"
license = "MIT"
repository = "https://github.com/TerrifyGary/htopModern"
homepage = "https://github.com/TerrifyGary/htopModern"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
sysinfo = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ratatui-image = { version = "11", default-features = false }
